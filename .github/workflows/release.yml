name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Anomaly runs LuaJIT; fail the release if any script doesn't parse.
      - name: Syntax-check scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq luajit
          for f in gamedata/scripts/*.script; do
            luajit -e "assert(loadfile('$f'))" || exit 1
          done

      # gamedata/ sits at the archive root so MO2 installs the zip as-is.
      # meta.ini is MO2's local install metadata and is deliberately left out.
      - name: Build mod archive
        run: |
          mkdir -p dist
          zip -r "dist/fix-hd-inventory-icon-pos-${GITHUB_REF_NAME}.zip" gamedata

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/fix-hd-inventory-icon-pos-${GITHUB_REF_NAME}.zip" \
            --title "Fix HD Inventory Icon Position $GITHUB_REF_NAME" \
            --generate-notes
